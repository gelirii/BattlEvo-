name: BattlEvo gameplay audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check core.js
          node --check brain-world.js
          node --check modes.js
          node --check ui.js
          node --check tests/smoke.js
          node --check tests/audit.js
      - name: Run runtime smoke test
        run: node tests/smoke.js
      - name: Run gameplay behaviour audit
        run: node tests/audit.js

  ui-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start static server
        run: |
          python3 -m http.server 8000 >/tmp/battlevo-server.log 2>&1 &
          sleep 1
      - name: Capture desktop and phone UI
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "Chrome/Chromium not present on runner"; exit 1; fi
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=1000 --screenshot=battlevo-desktop.png http://127.0.0.1:8000/
          "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=1000 --screenshot=battlevo-phone.png http://127.0.0.1:8000/
          test -s battlevo-desktop.png
          test -s battlevo-phone.png
      - uses: actions/upload-artifact@v4
        with:
          name: battlevo-ui
          path: |
            battlevo-desktop.png
            battlevo-phone.png
